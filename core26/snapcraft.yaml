name: sys-utils
title: System Utilities
summary: System utilities for diagnostics
description: |
  Sys-utils provides essential system utilities
  for hardware diagnostics.
version: '0.1'
base: core26
license: GPL-3.0+
source-code: https://github.com/laiderlai/sys-utils
contact: https://github.com/laiderlai/sys-utils
issues: https://github.com/laiderlai/sys-utils/issues
website: https://github.com/laiderlai/sys-utils
type: app
grade: stable
confinement: strict

platforms:
  amd64:
    build-on:
      - amd64
    build-for:
      - amd64
  arm64:
    build-on:
      - arm64
    build-for:
      - arm64

parts:
  pciutils:
    plugin: make
    source: https://github.com/pciutils/pciutils
    source-type: git
    source-tag: v3.15.0
    make-parameters:
      - PREFIX=/usr
      - SBINDIR=/usr/bin
      - ZLIB=yes
    build-packages:
      - build-essential
      - pkg-config
      - zlib1g-dev
    stage-packages:
      - zlib1g
    organize:
      usr/bin/lspci: bin/lspci
    prime:
      # No write permission under strict confinement
      # Remove unusable tools
      - -usr/bin
      - -usr/share/pci.ids
      - -usr/share/man/man8/pcilmr.8
      - -usr/share/man/man8/setpci.8
      - -usr/share/man/man8/update-pciids.8

  usbutils:
    plugin: meson
    source: https://github.com/gregkh/usbutils
    source-type: git
    source-tag: v019
    meson-parameters:
      - --prefix=/usr
    build-packages:
      - gcc
      - pkg-config
      - meson
      - ninja-build
      - libudev-dev
      - libusb-1.0-0-dev
    stage-packages:
      - libusb-1.0-0
    organize:
      usr/bin/lsusb: bin/lsusb
      usr/bin/usb-devices: bin/usb-devices
    prime:
      # No write permission under strict confinement
      # Remove unusable tools
      - -usr/bin
      - -usr/share/man/man1/lsusb.py.1
      - -usr/share/man/man8/usbhid-dump.8

  lshw:
    plugin: make
    source: https://github.com/lyonel/lshw
    source-type: git
    source-tag: B.02.20
    make-parameters:
      - PREFIX=/usr
      - SBINDIR=/usr/bin
      - ZLIB=1
    build-packages:
      - build-essential
      - pkg-config
      - zlib1g-dev
      - gettext
    stage-packages:
      - zlib1g
    organize:
      usr/bin/lshw: bin/lshw
    prime:
      # No write permission under strict confinement
      # Remove unusable tools
      - -usr/bin

  i2c-tools:
    plugin: make
    source: https://git.launchpad.net/~git-ubuntu-import/ubuntu/+source/i2c-tools
    source-type: git
    source-tag: import/4.4-2build3
    make-parameters:
      - PREFIX=/usr
      - sbindir=/usr/bin
      - USE_STATIC_LIB=1
    build-packages:
      - build-essential
    organize:
      usr/bin/i2cdetect: bin/i2cdetect
      usr/bin/i2cdump: bin/i2cdump
      usr/bin/i2cget: bin/i2cget
      usr/bin/i2cset: bin/i2cset
      usr/bin/i2ctransfer: bin/i2ctransfer
    prime:
      # Remove unusable tools (perl scripts) and build-only artifacts
      - -usr/bin
      - -usr/include
      - -usr/lib
      - -usr/share/man/man1/decode-dimms.1
      - -usr/share/man/man1/decode-vaio.1
      - -usr/share/man/man3/libi2c.3
      - -usr/share/man/man8/i2c-stub-from-dump.8

  # usbutils resolves vendor/product names through the udev hwdb
  # (hwdb.bin). Generate one inside the snap.
  hwdb:
    plugin: nil
    stage-packages:
      - udev
    override-build: |
      craftctl default
      systemd-hwdb update --root "${CRAFT_PART_INSTALL}"
    stage:
      - etc/udev/hwdb.bin

# Redirect to read vendor/product names
layout:
  /usr/share/pci.ids:
    bind-file: $SNAP/usr/share/pci.ids

  /etc/udev/hwdb.bin:
    bind-file: $SNAP/etc/udev/hwdb.bin

  /usr/share/lshw:
    bind: $SNAP/usr/share/lshw

apps:
  lspci:
    command: bin/lspci
    plugs:
      - hardware-observe
      - system-observe

  lsusb:
    command: bin/lsusb
    plugs:
      - hardware-observe
      - system-observe
      - raw-usb

  lshw:
    command: bin/lshw
    plugs:
      - hardware-observe
      - system-observe
      - raw-usb
      - block-devices

  usb-devices:
    command: bin/usb-devices
    plugs:
      - hardware-observe
      - system-observe
      - raw-usb

  i2cdetect:
    command: bin/i2cdetect
    plugs:
      - hardware-observe
      - system-observe
      - i2c

  i2cdump:
    command: bin/i2cdump
    plugs:
      - hardware-observe
      - system-observe
      - i2c

  i2cget:
    command: bin/i2cget
    plugs:
      - hardware-observe
      - system-observe
      - i2c

  i2cset:
    command: bin/i2cset
    plugs:
      - hardware-observe
      - system-observe
      - i2c

  i2ctransfer:
    command: bin/i2ctransfer
    plugs:
      - hardware-observe
      - system-observe
      - i2c

plugs:
  hardware-observe:
    interface: hardware-observe
  system-observe:
    interface: system-observe
  raw-usb:
    interface: raw-usb
  block-devices:
    interface: block-devices
  i2c:
    interface: i2c
